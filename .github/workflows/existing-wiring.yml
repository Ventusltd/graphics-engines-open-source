name: Check existing wiring pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/existing-wiring.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-wiring-browser
          path: .local/existing-wiring
          retention-days: 7
